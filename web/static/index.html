<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Discussion Prep — Socratic Practice</title>
  <base href="/discussion-prep/" />
  <link rel="stylesheet" href="static/style.css" />
</head>
<body>
  <header class="app-header">
    <h1>Discussion Prep</h1>
    <span id="round-badge" class="round-badge hidden"></span>
  </header>

  <div class="avatar-section">
    <img src="static/Avatar.png" class="avatar-circle" alt="Discussion Coach" />
  </div>

  <main id="chat" class="chat"></main>

  <footer class="composer">
    <textarea id="input-box" placeholder="State your argument…" rows="3"></textarea>
    <div class="composer-actions">
      <button id="new-session-btn" class="secondary" type="button">New Session</button>
      <div class="composer-actions-right">
        <button id="mic-btn" class="mic-btn" type="button" title="Start voice input">🎤</button>
        <button id="send-btn" type="button">Send</button>
      </div>
    </div>
  </footer>

  <script src="static/app.js"></script>
</body>
</html>
